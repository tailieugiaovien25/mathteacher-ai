name: AI Teaching Assistant regression

on:
  push:
    branches:
      - fix/teaching-assistant-safety-20261030
  pull_request:
    branches:
      - main
    paths:
      - "src/ai_kernel/**"
      - "src/ai_platform/**"
      - "src/portal_v2/ui/teaching_assistant_avatar_surface_streamlit.py"
      - "src/tests/test_ai*.py"
      - "src/tests/test_agent*.py"
      - "src/tests/test_teaching_*.py"
      - ".github/workflows/teaching-assistant-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile AI and teaching modules
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/ai_kernel src/ai_platform
          python -m py_compile src/portal_v2/ui/teaching_assistant_avatar_surface_streamlit.py
          python -m py_compile scripts/teaching_agent/livekit_local_worker.py

      - name: Run AI Kernel and AI Teaching Assistant regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            src/tests/test_ai*.py \
            src/tests/test_agent*.py \
            src/tests/test_teaching_*.py
