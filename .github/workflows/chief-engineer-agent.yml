name: Chief Engineer Agent tests

on:
  push:
    branches:
      - feature/chief-engineer-agent-v1
    paths:
      - "src/ai_kernel/chief_engineer_agent.py"
      - "src/tests/test_chief_engineer_agent_v1.py"
      - "src/tests/test_ai_agent_planner_v9.py"
      - "src/tests/test_ai_agent_runtime_v8.py"
      - ".github/workflows/chief-engineer-agent.yml"
      - "scripts/chief_engineer/**"
      - "docs/chief-engineer-agent-v1.md"
      - ".gitignore"
  pull_request:
    paths:
      - "src/ai_kernel/chief_engineer_agent.py"
      - "src/tests/test_chief_engineer_agent_v1.py"
      - "src/tests/test_ai_agent_planner_v9.py"
      - "src/tests/test_ai_agent_runtime_v8.py"
      - ".github/workflows/chief-engineer-agent.yml"
      - "scripts/chief_engineer/**"
      - "docs/chief-engineer-agent-v1.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  chief-engineer-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest==8.4.2
      - name: Run Chief Engineer Agent safety and patch workflow tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider src/tests/test_chief_engineer_agent_v1.py
      - name: Run existing AI Kernel planner/runtime regressions (Ubuntu)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider src/tests/test_ai_agent_planner_v9.py src/tests/test_ai_agent_runtime_v8.py
      - name: Validate PowerShell runner and Task Scheduler scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "scripts/chief_engineer/Run-ChiefEngineer.ps1",
            "scripts/chief_engineer/Register-ChiefEngineerTask.ps1",
            "scripts/chief_engineer/Unregister-ChiefEngineerTask.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ("PowerShell parse error in " + $file + ": " + ($parseErrors -join "; "))
            }
          }
          Write-Host "All Chief Engineer PowerShell scripts parsed successfully."
