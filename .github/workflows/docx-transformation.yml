name: DOCX transformation tests

on:
  pull_request:
    paths:
      - "mathteacher_ai/document_transformation/**"
      - "tests/document_transformation/**"
      - "src/portal_v2/ui/docx_formatting_streamlit.py"
      - "src/portal_v2/ui/standardized_lesson_plan_authoring_v2_streamlit.py"
      - ".github/workflows/docx-transformation.yml"
  push:
    paths:
      - "mathteacher_ai/document_transformation/**"
      - "tests/document_transformation/**"
      - "src/portal_v2/ui/docx_formatting_streamlit.py"
      - "src/portal_v2/ui/standardized_lesson_plan_authoring_v2_streamlit.py"

jobs:
  docx-transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install python-docx pytest lxml
      - run: python -m pytest tests/document_transformation -q
